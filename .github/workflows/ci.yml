name: DVWA SAST & DAST Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  sast:
    name: Run SAST (Semgrep with custom rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep with Custom SQL Injection Rules
        run: |
          semgrep --config p/owasp-top-ten --include "**/*.php" --sarif --output semgrep-results.sarif

      - name: Upload SAST results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif

  dast:
    name: Run DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Create Docker network
        run: docker network create zapnet
  
      - name: Start DVWA App (connected to network)
        run: |
          docker compose -f compose.yml up -d
          docker network connect zapnet $(docker ps -q --filter name=dvwa)
          sleep 30
  
      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://dvwa'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-config scanner.attackOnStart=true'
          network: zapnet
          fail_action: false
  
      - name: Stop containers
        run: docker compose down
